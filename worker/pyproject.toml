[project]
name = "dayson-worker"
version = "0.1.0"
description = "Dayson Inventory System planning worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsforecast>=2.0",
    "hierarchicalforecast>=1.0",
    "ortools>=9.10",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.22",
]

[project.scripts]
dayson-worker = "dayson_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayson_worker", "mechanics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes more than 60 s"]
